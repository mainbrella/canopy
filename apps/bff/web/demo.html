<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="A live, read-only message board powered by BFF." />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <title>Message board · BFF</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="wordmark" href="/bff/" aria-label="BFF home">bff<span aria-hidden="true">.</span></a>
      <a class="back-link" href="/bff/">Back to BFF <span aria-hidden="true">↗</span></a>
    </header>

    <main id="main" class="workspace">
      <div class="page-heading">
        <div>
          <h1>Message board</h1>
          <p>Messages from a live BFF project.</p>
        </div>
        <span class="read-only"><span aria-hidden="true"></span>Public demo · Read only</span>
      </div>

      <section class="board" aria-labelledby="board-title">
        <h2 id="board-title" class="visually-hidden">Messages</h2>
        <div class="toolbar">
          <label class="search-field" for="message-search">
            <span class="toolbar-label">Search messages</span>
            <span class="search-icon" aria-hidden="true"></span>
            <input id="message-search" type="search" placeholder="Search messages" autocomplete="off" />
          </label>
          <label class="sort-control" for="message-sort">
            <span class="toolbar-label">Sort by</span>
            <select id="message-sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </label>
          <button id="refresh" class="refresh-button" type="button" aria-label="Refresh messages">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 8a6.5 6.5 0 0 0-11.8-2L2.8 8M2.8 4.8V8h3.3M3.8 12a6.5 6.5 0 0 0 11.8 2l1.6-2M17.2 15.2V12h-3.3" /></svg>
            <span>Refresh</span>
          </button>
        </div>
        <p id="board-status" class="status-line" role="status" aria-live="polite">Loading messages…</p>
        <p id="refresh-error" class="inline-error" role="status" hidden></p>
        <div id="message-list" class="message-list" aria-busy="true"></div>
        <div id="board-state" class="board-state" hidden></div>
      </section>
    </main>

    <footer class="page-footer">
      <span>© Mainbrella</span>
      <button class="cookie-settings" type="button" data-cookie-settings aria-haspopup="dialog" aria-controls="cookie-consent">Cookie settings</button>
    </footer>
    <noscript><p class="noscript">Enable JavaScript to load messages from the live board.</p></noscript>
    <script type="module" src="/src/bff-demo.ts"></script>
  </body>
</html>
