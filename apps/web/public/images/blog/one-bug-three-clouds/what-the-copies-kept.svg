<svg xmlns="http://www.w3.org/2000/svg" width="850" height="716" viewBox="0 0 850 716" role="img" aria-labelledby="title desc">
  <title id="title">What the copies kept</title>
  <desc id="desc">Observed topology from the retained runs, not a measured timeline. All three providers preserved the checked files. Mainbrella and E2B sources retained their process nonce through capture; Daytona’s source had no listener afterward. E2B’s three branches inherited the source nonce. Mainbrella and Daytona branches initially had no listener. Explicit starts or restarts gave every branch a fresh nonce. Letters identify nonces within each provider, not across providers.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#69727a" stroke-width="1.3"/></marker>
    <g id="files" fill="#f7f4ec" stroke="#374650" stroke-width="1.8" stroke-linejoin="round"><path d="M1 7h23l9 9v27H1z"/><path d="M6 1h23l9 9v27H6z"/><path d="M29 1v9h9M13 18h17M13 25h17M13 32h11"/></g>
  </defs>
  <style>
    text{font-family:Helvetica,Arial,sans-serif;fill:#263238;font-size:20px}
    .heading{font-size:27px;font-weight:600}.provider{font-size:24px;font-weight:600}
    .small{font-size:17px;fill:#53616a}.label{font-size:18px}.nonce{font-size:19px;font-weight:600}
    .flow{fill:none;stroke:#69727a;stroke-width:1.6;marker-end:url(#arrow)}
    .process{fill:#f7f4ec;stroke:#374650;stroke-width:2.4}.absent{fill:#f7f4ec;stroke:#69727a;stroke-width:1.8;stroke-dasharray:4 4}
    .empty{fill:none;stroke:#69727a;stroke-width:1.6}.separator{stroke:#ced1cf;stroke-width:1}
  </style>
  <rect width="850" height="716" rx="4" fill="#f7f4ec"/>
<text x="26" y="39" class="heading" text-anchor="start">What the copies kept</text>
<text x="26" y="66" class="small" text-anchor="start">Observed copy topology · not a measured timeline</text>
<use href="#files" transform="translate(27 82) scale(0.55)"/>
<text x="58" y="102" class="small" text-anchor="start">Checked files</text>
<g><circle cx="234" cy="96" r="18" class="process"/><text x="234" y="102" class="nonce" text-anchor="middle">A</text></g>
<text x="262" y="102" class="small" text-anchor="start">Process nonce</text>
<g><circle cx="442" cy="96" r="18" class="absent"/><path d="M436 96h12" class="empty"/></g>
<text x="471" y="102" class="small" text-anchor="start">No listener</text>
<text x="260" y="139" class="" text-anchor="middle">Source</text>
<text x="260" y="161" class="small" text-anchor="middle">after capture</text>
<text x="493" y="139" class="" text-anchor="middle">Three branches</text>
<text x="493" y="161" class="small" text-anchor="middle">before launch or patch</text>
<text x="741" y="139" class="" text-anchor="middle">After explicit</text>
<text x="741" y="161" class="small" text-anchor="middle">start / restart</text>
<text x="26" y="211" class="provider" text-anchor="start">Mainbrella</text>
<text x="26" y="235" class="small" text-anchor="start">Saved workspace</text>
<use href="#files" transform="translate(205 225) scale(1)"/><g><circle cx="273" cy="245" r="18" class="process"/><text x="273" y="251" class="nonce" text-anchor="middle">A</text></g>
<text x="248" y="289" class="small" text-anchor="middle">Same nonce</text>
<path d="M295 245H350M350 199V291" fill="none" stroke="#69727a" stroke-width="1.6"/>
<path d="M350 199H394" class="flow"/>
<use href="#files" transform="translate(400 179) scale(1)"/><g><circle cx="468" cy="199" r="18" class="absent"/><path d="M462 199h12" class="empty"/></g>
<text x="503" y="205" class="label" text-anchor="start">Baseline</text>
<path d="M615 199H708" class="flow"/>
<g><circle cx="741" cy="199" r="18" class="process"/><text x="741" y="205" class="nonce" text-anchor="middle">B</text></g>
<path d="M350 245H394" class="flow"/>
<use href="#files" transform="translate(400 225) scale(1)"/><g><circle cx="468" cy="245" r="18" class="absent"/><path d="M462 245h12" class="empty"/></g>
<text x="503" y="251" class="label" text-anchor="start">Correct</text>
<path d="M615 245H708" class="flow"/>
<g><circle cx="741" cy="245" r="18" class="process"/><text x="741" y="251" class="nonce" text-anchor="middle">C</text></g>
<path d="M350 291H394" class="flow"/>
<use href="#files" transform="translate(400 271) scale(1)"/><g><circle cx="468" cy="291" r="18" class="absent"/><path d="M462 291h12" class="empty"/></g>
<text x="503" y="297" class="label" text-anchor="start">Misleading</text>
<path d="M615 291H708" class="flow"/>
<g><circle cx="741" cy="291" r="18" class="process"/><text x="741" y="297" class="nonce" text-anchor="middle">D</text></g>
<path d="M26 323H824" class="separator"/>
<text x="26" y="378" class="provider" text-anchor="start">E2B</text>
<text x="26" y="402" class="small" text-anchor="start">Native memory fork</text>
<use href="#files" transform="translate(205 392) scale(1)"/><g><circle cx="273" cy="412" r="18" class="process"/><text x="273" y="418" class="nonce" text-anchor="middle">A</text></g>
<text x="248" y="456" class="small" text-anchor="middle">Same nonce</text>
<path d="M295 412H350M350 366V458" fill="none" stroke="#69727a" stroke-width="1.6"/>
<path d="M350 366H394" class="flow"/>
<use href="#files" transform="translate(400 346) scale(1)"/><g><circle cx="468" cy="366" r="18" class="process"/><text x="468" y="372" class="nonce" text-anchor="middle">A</text></g>
<text x="503" y="372" class="label" text-anchor="start">Baseline</text>
<path d="M615 366H708" class="flow"/>
<g><circle cx="741" cy="366" r="18" class="process"/><text x="741" y="372" class="nonce" text-anchor="middle">B</text></g>
<path d="M350 412H394" class="flow"/>
<use href="#files" transform="translate(400 392) scale(1)"/><g><circle cx="468" cy="412" r="18" class="process"/><text x="468" y="418" class="nonce" text-anchor="middle">A</text></g>
<text x="503" y="418" class="label" text-anchor="start">Correct</text>
<path d="M615 412H708" class="flow"/>
<g><circle cx="741" cy="412" r="18" class="process"/><text x="741" y="418" class="nonce" text-anchor="middle">C</text></g>
<path d="M350 458H394" class="flow"/>
<use href="#files" transform="translate(400 438) scale(1)"/><g><circle cx="468" cy="458" r="18" class="process"/><text x="468" y="464" class="nonce" text-anchor="middle">A</text></g>
<text x="503" y="464" class="label" text-anchor="start">Misleading</text>
<path d="M615 458H708" class="flow"/>
<g><circle cx="741" cy="458" r="18" class="process"/><text x="741" y="464" class="nonce" text-anchor="middle">D</text></g>
<path d="M26 490H824" class="separator"/>
<text x="26" y="545" class="provider" text-anchor="start">Daytona</text>
<text x="26" y="569" class="small" text-anchor="start">Container snapshot</text>
<use href="#files" transform="translate(205 559) scale(1)"/><g><circle cx="273" cy="579" r="18" class="absent"/><path d="M267 579h12" class="empty"/></g>
<text x="248" y="623" class="small" text-anchor="middle">No listener</text>
<path d="M295 579H350M350 533V625" fill="none" stroke="#69727a" stroke-width="1.6"/>
<path d="M350 533H394" class="flow"/>
<use href="#files" transform="translate(400 513) scale(1)"/><g><circle cx="468" cy="533" r="18" class="absent"/><path d="M462 533h12" class="empty"/></g>
<text x="503" y="539" class="label" text-anchor="start">Baseline</text>
<path d="M615 533H708" class="flow"/>
<g><circle cx="741" cy="533" r="18" class="process"/><text x="741" y="539" class="nonce" text-anchor="middle">B</text></g>
<path d="M350 579H394" class="flow"/>
<use href="#files" transform="translate(400 559) scale(1)"/><g><circle cx="468" cy="579" r="18" class="absent"/><path d="M462 579h12" class="empty"/></g>
<text x="503" y="585" class="label" text-anchor="start">Correct</text>
<path d="M615 579H708" class="flow"/>
<g><circle cx="741" cy="579" r="18" class="process"/><text x="741" y="585" class="nonce" text-anchor="middle">C</text></g>
<path d="M350 625H394" class="flow"/>
<use href="#files" transform="translate(400 605) scale(1)"/><g><circle cx="468" cy="625" r="18" class="absent"/><path d="M462 625h12" class="empty"/></g>
<text x="503" y="631" class="label" text-anchor="start">Misleading</text>
<path d="M615 625H708" class="flow"/>
<g><circle cx="741" cy="625" r="18" class="process"/><text x="741" y="631" class="nonce" text-anchor="middle">D</text></g>
<text x="26" y="692" class="small" text-anchor="start">A = source nonce within each provider. B, C, D = fresh nonces.</text>
</svg>
