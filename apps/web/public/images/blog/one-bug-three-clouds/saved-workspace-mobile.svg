<svg xmlns="http://www.w3.org/2000/svg" width="360" height="544" viewBox="0 0 360 544" role="img" aria-labelledby="title desc">
  <title id="title">Saved files, fresh servers</title>
  <desc id="desc">Mobile schematic of the observed local and production Mainbrella experiments. The source keeps its process nonce through capture. Saved files fan out to the baseline, correct, and misleading branches. Each branch has no listener until its server is started with a fresh nonce.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#55616c" stroke-width="1.4"/></marker>
    <g id="files" fill="#f7f4ec" stroke="#55616c" stroke-width="2"><path d="M0 3h12l4 5h19v28H0z"/><path d="M6 15h23M6 23h23M6 31h15"/></g>
  </defs>
  <style>text{font-family:Helvetica,Arial,sans-serif;fill:#263238;font-size:17px}.small{font-size:15px;fill:#55616c}.heading{font-size:23px;font-weight:600}.label{font-weight:600}.file-path{fill:none;stroke:#55616c;stroke-width:2;marker-end:url(#arrow)}.process{fill:none;stroke:#397b5c;stroke-width:4}.absent{fill:none;stroke:#55616c;stroke-width:2;stroke-dasharray:5 6}</style>
  <rect width="360" height="544" rx="4" fill="#f7f4ec"/>
  <text x="20" y="36" class="heading">Saved files, fresh servers</text>
  <text x="20" y="60" class="small">Local + production · schematic</text>
  <text x="20" y="96" class="label">Source server keeps running</text>
  <path d="M20 113H336" class="process"/>
  <circle cx="55" cy="113" r="5" fill="#397b5c"/>
  <text x="157" y="137" class="small">Same process nonce</text>
  <path d="M55 122V166" class="file-path"/>
  <use href="#files" x="37" y="178"/>
  <text x="89" y="192" class="label">Saved files</text>
  <text x="89" y="215" class="small">Checkout + dependencies</text>
  <path d="M55 216V280" class="file-path"/>
  <path d="M25 201H14V382H36" class="file-path"/>
  <path d="M25 201H14V480H36" class="file-path"/>
  <text x="89" y="270" class="label">Baseline</text>
  <text x="89" y="368" class="label">Correct patch</text>
  <text x="89" y="466" class="label">Misleading patch</text>
  <use href="#files" x="37" y="285"/>
  <use href="#files" x="37" y="383"/>
  <use href="#files" x="37" y="481"/>
  <path d="M77 303H239M77 401H239M77 499H239" class="absent"/>
  <text x="89" y="294" class="small">No listener</text>
  <text x="89" y="392" class="small">No listener</text>
  <text x="89" y="490" class="small">No listener</text>
  <path d="M244 303H336M244 401H336M244 499H336" class="process"/>
  <g fill="#397b5c"><circle cx="244" cy="303" r="5"/><circle cx="244" cy="401" r="5"/><circle cx="244" cy="499" r="5"/></g>
  <text x="250" y="294" class="small">New nonce</text>
  <text x="250" y="392" class="small">New nonce</text>
  <text x="250" y="490" class="small">New nonce</text>
  <text x="244" y="329" text-anchor="middle" class="small">Start server</text>
  <text x="244" y="427" text-anchor="middle" class="small">Start server</text>
  <text x="244" y="525" text-anchor="middle" class="small">Start server</text>
</svg>
