<text x="321" y="362" class="label" text-anchor="middle">Misleading</text>
<path d="M321 373V393" class="flow"/>
<g><circle cx="321" cy="418" r="18" class="process"/><text x="321" y="424" class="nonce" text-anchor="middle">D</text></g>
<text x="195" y="458" class="small" text-anchor="middle">Fresh nonces after explicit start / restart</text>
<path d="M20 474H370" class="separator"/>
<text x="20" y="500" class="provider" text-anchor="start">E2B</text>
