<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1258" viewBox="0 0 390 1258" role="img" aria-labelledby="title desc">
  <title id="title">What the copies kept</title>
  <desc id="desc">Observed topology from the retained runs, not a measured timeline. All three providers preserved the checked files. Mainbrella and E2B sources retained their process nonce through capture; Daytona’s source had no listener afterward. E2B’s three branches inherited the source nonce. Mainbrella and Daytona branches initially had no listener. Explicit starts or restarts gave every branch a fresh nonce. Letters identify nonces within each provider, not across providers.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#69727a" stroke-width="1.3"/></marker>
    <g id="files" fill="#f7f4ec" stroke="#374650" stroke-width="1.8" stroke-linejoin="round"><path d="M1 7h23l9 9v27H1z"/><path d="M6 1h23l9 9v27H6z"/><path d="M29 1v9h9M13 18h17M13 25h17M13 32h11"/></g>
  </defs>
  <style>
    text{font-family:Helvetica,Arial,sans-serif;fill:#263238;font-size:18px}
    .heading{font-size:24px;font-weight:600}.provider{font-size:23px;font-weight:600}
    .small{font-size:16px;fill:#53616a}.label{font-size:17px}.nonce{font-size:19px;font-weight:600}
    .flow{fill:none;stroke:#69727a;stroke-width:1.6;marker-end:url(#arrow)}
    .process{fill:#f7f4ec;stroke:#374650;stroke-width:2.4}.absent{fill:#f7f4ec;stroke:#69727a;stroke-width:1.8;stroke-dasharray:4 4}
    .empty{fill:none;stroke:#69727a;stroke-width:1.6}.separator{stroke:#ced1cf;stroke-width:1}
  </style>
  <rect width="390" height="1258" rx="4" fill="#f7f4ec"/>
<text x="20" y="36" class="heading" text-anchor="start">What the copies kept</text>
<text x="20" y="62" class="small" text-anchor="start">Observed topology, not a timeline</text>
<use href="#files" transform="translate(20 82) scale(0.5)"/>
<text x="47" y="101" class="small" text-anchor="start">Files</text>
<g><circle cx="123" cy="95" r="18" class="process"/><text x="123" y="101" class="nonce" text-anchor="middle">A</text></g>
<text x="150" y="101" class="small" text-anchor="start">Nonce</text>
<g><circle cx="252" cy="95" r="18" class="absent"/><path d="M246 95h12" class="empty"/></g>
<text x="280" y="101" class="small" text-anchor="start">No listener</text>
<text x="20" y="144" class="provider" text-anchor="start">Mainbrella</text>
<text x="20" y="168" class="small" text-anchor="start">Saved workspace</text>
<text x="195" y="197" class="label" text-anchor="middle">Source after capture</text>
<use href="#files" transform="translate(152 206) scale(1)"/><g><circle cx="220" cy="226" r="18" class="process"/><text x="220" y="232" class="nonce" text-anchor="middle">A</text></g>
<path d="M195 248V269M69 269H321" fill="none" stroke="#69727a" stroke-width="1.6"/>
<path d="M69 269V289" class="flow"/>
<use href="#files" transform="translate(26 295) scale(1)"/><g><circle cx="94" cy="315" r="18" class="absent"/><path d="M88 315h12" class="empty"/></g>
<text x="69" y="362" class="label" text-anchor="middle">Baseline</text>
<path d="M69 373V393" class="flow"/>
<g><circle cx="69" cy="418" r="18" class="process"/><text x="69" y="424" class="nonce" text-anchor="middle">B</text></g>
<path d="M195 269V289" class="flow"/>
<use href="#files" transform="translate(152 295) scale(1)"/><g><circle cx="220" cy="315" r="18" class="absent"/><path d="M214 315h12" class="empty"/></g>
<text x="195" y="362" class="label" text-anchor="middle">Correct</text>
<path d="M195 373V393" class="flow"/>
<g><circle cx="195" cy="418" r="18" class="process"/><text x="195" y="424" class="nonce" text-anchor="middle">C</text></g>
