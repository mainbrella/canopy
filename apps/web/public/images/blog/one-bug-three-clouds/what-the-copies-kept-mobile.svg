<text x="69" y="718" class="label" text-anchor="middle">Baseline</text>
<path d="M69 729V749" class="flow"/>
<g><circle cx="69" cy="774" r="18" class="process"/><text x="69" y="780" class="nonce" text-anchor="middle">B</text></g>
