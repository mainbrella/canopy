<path d="M321 981V1001" class="flow"/>
<use href="#files" transform="translate(278 1007) scale(1)"/><g><circle cx="346" cy="1027" r="18" class="absent"/><path d="M340 1027h12" class="empty"/></g>
<text x="321" y="1074" class="label" text-anchor="middle">Misleading</text>
<path d="M321 1085V1105" class="flow"/>
<g><circle cx="321" cy="1130" r="18" class="process"/><text x="321" y="1136" class="nonce" text-anchor="middle">D</text></g>
<text x="195" y="1170" class="small" text-anchor="middle">Fresh nonces after explicit start / restart</text>
<text x="20" y="1214" class="small" text-anchor="start">A = source nonce within each provider.</text>
<text x="20" y="1237" class="small" text-anchor="start">B, C, D = fresh nonces.</text>
</svg>
