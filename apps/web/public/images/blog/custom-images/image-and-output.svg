<path d="M 205 199 V 287 H 245" fill="none" stroke="#376b8c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="252" y="63" width="296" height="137" rx="12" fill="#fbfaf6" stroke="#7e8b8a" stroke-width="1.5"/>
<text x="270" y="88" fill="#263238" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="650" text-anchor="start">Job A · after the report</text>
<rect x="270" y="101" width="48" height="24" rx="12" fill="#e5eef2" stroke="none" stroke-width="0"/>
<text x="294" y="118" fill="#376b8c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">jq</text>
