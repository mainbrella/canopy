<text x="678" y="259" fill="#263238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">report.csv</text>
<ellipse cx="678" cy="301" rx="20" ry="7" fill="#e4f0e7" stroke="#28734c" stroke-width="1.7"/><path d="M 658 301 v 27 c 0 4 9 7 20 7 s 20-3 20-7 v-27" fill="#e4f0e7" stroke="#28734c" stroke-width="1.7"/><path d="M 658 315 c 0 4 9 7 20 7 s 20-3 20-7" fill="none" stroke="#28734c" stroke-width="1.4"/><ellipse cx="678" cy="301" rx="20" ry="7" fill="#e4f0e7" stroke="#28734c" stroke-width="1.7"/>
<text x="678" y="360" fill="#263238" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Your storage</text>
