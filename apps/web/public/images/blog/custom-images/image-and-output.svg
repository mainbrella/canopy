<svg xmlns="http://www.w3.org/2000/svg" width="784" height="400" viewBox="0 0 784 400" role="img" aria-labelledby="title desc">
<title id="title">Prepared image and independent job output</title>
<desc id="desc">A prepared image with jq launches two independent jobs. Job A writes report.csv and exports a copy to your storage before stopping. Job B starts with jq and no report. Job writes do not change the image.</desc>
<defs>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#376b8c"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28734c"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
<text x="24" y="32" fill="#5b686b" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="650" text-anchor="start" letter-spacing="0.15">One image, two fresh filesystems</text>
<line x1="576" y1="48" x2="576" y2="376" stroke="#9aa5a2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="591" y="32" fill="#5b686b" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="start">Outside the machine</text>
<rect x="69.0" y="181.0" width="59.0" height="39.0" rx="6" fill="#f7f4ec" stroke="#376b8c" stroke-width="1.6"/><rect x="75.0" y="174.0" width="59.0" height="39.0" rx="6" fill="#e5eef2" stroke="#376b8c" stroke-width="1.6"/><rect x="81.0" y="167.0" width="59.0" height="39.0" rx="6" fill="#f7f4ec" stroke="#376b8c" stroke-width="1.8"/><path d="M 91.0 179.0 h 20.0 M 91.0 187.0 h 28.0" stroke="#376b8c" stroke-width="1.8" stroke-linecap="round"/>
<text x="100" y="250" fill="#263238" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Prepared image</text>
<rect x="71" y="264" width="58" height="27" rx="13" fill="#e5eef2" stroke="#376b8c" stroke-width="1.2"/>
<text x="100" y="283" fill="#376b8c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">jq</text>
