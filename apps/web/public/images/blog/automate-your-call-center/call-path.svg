<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" fill="none">
  <title>The audio paths through Mainbrella</title>
  <desc>Browser audio enters directly. Telephone audio goes through Twilio and a format bridge. Inside the operator's Cloudflare account, a per-call Durable Object uses Flux, Llama and Aura in sequence, returns generated audio, and saves transcripts to D1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#46626d" stroke-width="1.5"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#24353b} .label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#465a61}.flow{stroke:#46626d;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.node{fill:#fffdf8;stroke:#aab7b8;stroke-width:1.5}</style>
  </defs>
  <rect width="840" height="580" rx="8" fill="#f7f4ec"/>
  <rect x="24" y="194" width="792" height="362" rx="12" fill="#edf2ef" stroke="#aab7b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="46" y="220" class="small">Your Cloudflare account</text>

  <g stroke="#46626d" stroke-width="2.5">
    <rect x="113" y="43" width="64" height="48" rx="4" fill="#fffdf8"/>
    <path d="M113 56h64M124 50h1m8 0h1m8 0h1M131 73l-7 5 7 5m28-10 7 5-7 5"/>
    <rect x="419" y="40" width="32" height="54" rx="6" fill="#fffdf8"/>
    <path d="M429 47h12m-10 39h8"/>
  </g>
  <text x="145" y="122" class="label" text-anchor="middle">Browser</text>
  <text x="435" y="122" class="label" text-anchor="middle">Phone</text>
  <rect x="558" y="48" width="152" height="60" rx="30" class="node"/>
  <text x="634" y="85" class="label" text-anchor="middle">Twilio</text>
  <path d="M465 78h87" class="flow both"/>
  <path d="M145 143v101h179" class="flow both"/>
  <text x="160" y="174" class="small">16 kHz PCM</text>
  <path d="M634 115v99" class="flow both"/>
  <text x="649" y="164" class="small">8 kHz μ-law</text>

  <rect x="548" y="220" width="176" height="48" rx="6" class="node"/>
  <text x="636" y="250" class="label" text-anchor="middle">Audio bridge</text>
  <path d="M542 244h-46" class="flow both"/>
  <text x="520" y="290" class="small" text-anchor="middle">PCM16</text>
  <rect x="330" y="218" width="160" height="64" rx="8" fill="#dce9e5" stroke="#728e86" stroke-width="1.5"/>
  <text x="410" y="244" class="label" text-anchor="middle">One call</text>
  <text x="410" y="267" class="small" text-anchor="middle">Durable Object</text>

  <path d="M365 288v61H154v67" class="flow"/>
  <text x="180" y="337" class="small">Incoming audio</text>
  <path d="M654 416v-49H446v-79" class="flow"/>
  <text x="516" y="353" class="small">Spoken reply</text>
  <path d="M490 270h267v39" class="flow"/>
  <text x="703" y="294" class="small" text-anchor="middle">Save text</text>
  <path d="M718 320c0-15 78-15 78 0v31c0 15-78 15-78 0Z" class="node"/>
  <ellipse cx="757" cy="320" rx="39" ry="11" fill="#fffdf8" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="757" y="348" class="label" text-anchor="middle">D1</text>
  <text x="757" y="385" class="small" text-anchor="middle">Transcripts</text>

  <text x="48" y="400" class="small">Workers AI</text>
  <rect x="79" y="422" width="150" height="64" rx="6" class="node"/>
  <rect x="324" y="422" width="160" height="64" rx="6" class="node"/>
  <rect x="579" y="422" width="150" height="64" rx="6" class="node"/>
  <text x="154" y="449" class="label" text-anchor="middle">Flux</text>
  <text x="154" y="472" class="small" text-anchor="middle">Speech → text</text>
  <text x="404" y="449" class="label" text-anchor="middle">Llama 3.3 70B</text>
  <text x="404" y="472" class="small" text-anchor="middle">Generate reply</text>
  <text x="654" y="449" class="label" text-anchor="middle">Aura-1</text>
  <text x="654" y="472" class="small" text-anchor="middle">Text → speech</text>
  <path d="M235 454h83" class="flow"/>
  <text x="276" y="440" class="small" text-anchor="middle">Text</text>
  <path d="M490 454h83" class="flow"/>
  <text x="532" y="440" class="small" text-anchor="middle">Reply</text>
  <text x="48" y="531" class="small">Audio returns along the same browser or phone connection.</text>
</svg>
