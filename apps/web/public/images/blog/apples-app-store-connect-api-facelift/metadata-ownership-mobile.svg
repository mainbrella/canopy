<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600">
  <title>Two kinds of localized metadata</title>
  <desc>App information and a selected version branch from one app. Each owns separate locale resources; names and privacy URLs are in the first branch, release notes and descriptions in the second.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#58626c" stroke-width="1.3"/></marker></defs>
  <rect width="440" height="600" rx="4" fill="#f5f2ea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#263238">
    <rect x="20" y="259" width="78" height="58" rx="29" fill="#e4e8eb"/>
    <text x="59" y="295" font-size="23" font-weight="600" text-anchor="middle">App</text>
    <g fill="none" stroke="#58626c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M98 288h25V59h28"/>
      <path d="M123 288v77h28"/>
      <path d="M282 85v40"/>
      <path d="M282 391v40"/>
    </g>
    <rect x="156" y="34" width="252" height="51" rx="4" fill="#e3eaf2"/>
    <text x="282" y="66" font-size="21" font-weight="600" text-anchor="middle">App information</text>
    <rect x="148" y="123" width="248" height="144" rx="4" fill="#fffdf8" stroke="#a4b6c9"/>
    <text x="167" y="150" font-size="18" fill="#526579">en-US</text>
    <rect x="160" y="160" width="248" height="137" rx="4" fill="#e3eaf2" stroke="#7c94ad"/>
    <text x="179" y="189" font-size="19" font-weight="600">fr-FR</text>
    <path d="M179 202h208" stroke="#b2c1d0"/>
    <g font-size="20"><text x="179" y="228">Name</text><text x="179" y="255">Subtitle</text><text x="179" y="282">Privacy URL</text></g>
    <rect x="156" y="340" width="252" height="51" rx="4" fill="#dfece3"/>
    <text x="282" y="372" font-size="21" font-weight="600" text-anchor="middle">Selected version</text>
    <rect x="148" y="429" width="248" height="144" rx="4" fill="#fffdf8" stroke="#98b4a2"/>
    <text x="167" y="456" font-size="18" fill="#496954">en-US</text>
    <rect x="160" y="466" width="248" height="114" rx="4" fill="#dfece3" stroke="#769b83"/>
    <text x="179" y="494" font-size="19" font-weight="600">fr-FR</text>
    <path d="M179 507h208" stroke="#abc5b5"/>
    <g font-size="20"><text x="179" y="531">Description</text><text x="179" y="552">Keywords</text><text x="179" y="573">Release notes</text></g>
  </g>
</svg>
