<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 440 480">
  <title>Planned recovery from a lost write response</title>
  <desc>Time moves downward. Parsequerade saves an intent, sends an update that Apple applies, and loses the reply. It records an unknown outcome, then reads the resource to help reconcile it.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#58626c" stroke-width="1.3"/></marker>
    <marker id="read-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#496b86" stroke-width="1.3"/></marker>
  </defs>
  <rect width="440" height="480" rx="4" fill="#f5f2ea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#263238">
    <text x="24" y="34" font-size="16" fill="#58626c">Planned write handling</text>
    <text x="128" y="76" font-size="21" font-weight="600" text-anchor="middle">Parsequerade</text>
    <text x="360" y="76" font-size="21" font-weight="600" text-anchor="middle">Apple</text>
    <g stroke="#c0c4c5" stroke-width="2"><path d="M128 93v342"/><path d="M360 93v342"/></g>
    <path d="M25 105v328" stroke="#a5abae" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="11" y="276" font-size="15" fill="#58626c" text-anchor="middle" transform="rotate(-90 11 276)">Time</text>
    <rect x="122" y="117" width="12" height="12" fill="#496b86"/>
    <text x="146" y="130" font-size="18">Save intent</text>
    <path d="M136 170h215" stroke="#58626c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="244" y="158" font-size="18" text-anchor="middle">Send update</text>
    <circle cx="360" cy="209" r="7" fill="#4d785d"/>
    <text x="341" y="215" font-size="18" text-anchor="end">Applied</text>
    <path d="M352 254H222" stroke="#a16450" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="m208 247 14 14m0-14-14 14" stroke="#a16450" stroke-width="2.5"/>
    <text x="285" y="243" font-size="18" text-anchor="middle" fill="#85513f">Reply lost</text>
    <rect x="122" y="300" width="12" height="12" fill="#a16450"/>
    <text x="146" y="313" font-size="18">Outcome unknown</text>
    <path d="M136 368h215" stroke="#496b86" stroke-width="2" marker-end="url(#read-arrow)"/>
    <text x="244" y="356" font-size="18" text-anchor="middle">Fresh read</text>
    <path d="M352 425H137" stroke="#496b86" stroke-width="2" marker-end="url(#read-arrow)"/>
    <text x="244" y="451" font-size="18" text-anchor="middle">Current resource</text>
  </g>
</svg>
