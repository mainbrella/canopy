<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
  <title>Inference, execution, and retained code</title>
  <desc>The build workflow connects to Cloudflare's model, executes tools on a Linux guest, and retains files and Git bundles in R2 with version metadata in D1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#35444e" stroke-width="1.8"/></marker>
    <g id="bucket"><path d="M0 14V74C0 93 100 93 100 74V14" fill="#e0eef2" stroke="#236078" stroke-width="2"/><ellipse cx="50" cy="14" rx="50" ry="14" fill="#f7f4ec" stroke="#236078" stroke-width="2"/><path d="M0 56C0 74 100 74 100 56" fill="none" stroke="#236078" stroke-width="2"/></g>
    <g id="gpu"><rect x="15" y="12" width="70" height="58" rx="3" fill="#ede6f5" stroke="#67517c" stroke-width="2"/><rect x="30" y="25" width="40" height="32" fill="#f7f4ec" stroke="#67517c" stroke-width="2"/><path d="M29 3V12M43 3V12M57 3V12M71 3V12M29 70V79M43 70V79M57 70V79M71 70V79M6 24H15M6 39H15M6 54H15M85 24H94M85 39H94M85 54H94" stroke="#67517c" stroke-width="2"/></g>
    <g id="machine"><rect width="66" height="79" rx="3" fill="#f2e7dc" stroke="#91512f" stroke-width="2"/><path d="M12 17H54M12 33H54M12 49H54" stroke="#91512f" stroke-width="2"/><circle cx="49" cy="65" r="3" fill="#91512f"/></g>
  </defs>
  <rect width="880" height="450" rx="4" fill="#f7f4ec"/>
  <g font-family="system-ui, sans-serif" fill="#263238" text-anchor="middle">
    <text x="440" y="37" font-size="23" font-weight="600">Inference, execution, and retained code</text>
    <rect x="27" y="65" width="198" height="362" rx="4" fill="#eaf0eb"/>
    <text x="126" y="94" font-size="20">Retained storage</text>
    <use href="#bucket" x="76" y="111"/>
    <text x="126" y="236" font-size="23" font-weight="600">R2</text>
    <text x="126" y="264" font-size="20">Files + Git bundles</text>
    <g transform="translate(91 318)"><path d="M0 9V46C0 60 70 60 70 46V9" fill="#fffdf7" stroke="#236078" stroke-width="2"/><ellipse cx="35" cy="9" rx="35" ry="9" fill="#eaf0eb" stroke="#236078" stroke-width="2"/><path d="M0 29C0 41 70 41 70 29" fill="none" stroke="#236078" stroke-width="2"/></g>
    <text x="126" y="405" font-size="20">D1: version head</text>
    <rect x="327" y="165" width="205" height="112" rx="4" fill="#fffdf7" stroke="#35444e" stroke-width="2"/>
    <text x="430" y="199" font-size="23" font-weight="600">Mainbrella</text>
    <text x="430" y="231" font-size="22">Build workflow</text>
    <text x="430" y="259" font-size="19">Tools + results</text>
    <use href="#gpu" x="691" y="83"/>
    <text x="741" y="72" font-size="23" font-weight="600">Workers AI</text>
    <text x="741" y="196" font-size="21">GPU inference</text>
    <use href="#machine" x="708" y="327"/>
    <text x="741" y="307" font-size="23" font-weight="600">Linux guest</text>
    <text x="741" y="434" font-size="21">tsc · Vite · Git</text>
    <path d="M326 194H254V154H184" fill="none" stroke="#35444e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="258" y="130" font-size="20">Save / read</text>
    <path d="M327 247H254V351H169" fill="none" stroke="#35444e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="265" y="311" font-size="20">Publish</text>
    <path d="M534 194H598V124H683" fill="none" stroke="#35444e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="602" y="101" font-size="20">Infer</text>
    <path d="M534 247H598V365H697" fill="none" stroke="#35444e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="601" y="337" font-size="20">Execute</text>
  </g>
</svg>
