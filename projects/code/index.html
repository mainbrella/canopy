<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mainbrella.com/projects/code/" />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/mainbrella.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="../../src/build-source.css" />
    <link rel="stylesheet" href="./code.css" />
    <title>Code · Mainbrella</title>
  </head>
  <body class="info-body sandbox-home app-body dashboard-body">
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- app-header -->
    <main id="main" class="dashboard-main project-code-main" aria-busy="true">
      <a class="project-code-back text-link" href="/projects/">← Projects</a>
      <div class="dashboard-section-heading">
        <h1 id="code-title">Code</h1>
        <button id="code-download" class="dashboard-retry" type="button" disabled hidden>Download repository</button>
      </div>
      <p id="code-status" class="dashboard-status" role="status">Checking your session…</p>
      <p id="code-error" class="dashboard-error" role="alert" hidden></p>
      <button id="code-retry" class="dashboard-retry" type="button" hidden>Retry</button>
      <section id="code-source" class="build-repository-panel project-code-source" aria-label="Project source code" hidden></section>
      <noscript><p>Enable JavaScript to browse project code.</p></noscript>
    </main>
    <script type="module" src="/src/account-menu.ts"></script>
    <script type="module" src="/src/project-code.ts"></script>
  </body>
</html>
