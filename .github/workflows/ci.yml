name: Canopy checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_full: ${{ steps.scope.outputs.backend_full }}
      services: ${{ steps.scope.outputs.services }}
      sdk: ${{ steps.scope.outputs.sdk }}
      site: ${{ steps.scope.outputs.site }}
      builder: ${{ steps.scope.outputs.builder }}
      raindrop_ui: ${{ steps.scope.outputs.raindrop_ui }}
      ops: ${{ steps.scope.outputs.ops }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-migration.mjs
      - run: npm test
      - run: npm run test:platform
      - run: npm run check:boundaries
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/affected-targets.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  backend-full:
    needs: changes
    if: needs.changes.outputs.backend_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test scripts/affected-targets.test.mjs apps/backend/scripts/service-changes.test.mjs
      - run: npm test -w @canopy/backend
      - run: npm run test:openapi -w @canopy/backend
      - run: npm run type-check -w @canopy/backend
      - run: npm run type-check -w @canopy/voice
      - run: npm run type-check -w @canopy/vibe
      - run: npm run type-check -w @canopy/linux
      - run: git diff --exit-code -- apps/backend/cloudflare-configuration.d.ts
      - run: npm run check:containers -w @canopy/backend
      - run: node scripts/check-bundle.mjs containers
      - run: npm run check:previews -w @canopy/backend
      - run: npm run docs:generate -w @canopy/backend
      - run: npm run check:services -w @canopy/backend
      - run: npm run check:api -w @canopy/backend
      - name: Validate workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern '*linux_amd64.tar.gz' --dir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP"/actionlint/*linux_amd64.tar.gz -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=

  backend-services:
    needs: changes
    if: needs.changes.outputs.backend_full == 'false' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:${{ matrix.service }} -w @canopy/backend
      - run: npm run type-check -w @canopy/backend
      - run: npm run check:${{ matrix.service }} -w @canopy/backend

  sdk-artifacts:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: npm run sdk:qualify -w @canopy/backend
      - name: Smoke-test qualification with installed archives
        run: node --test scripts/sdk-deployed.test.mjs
        working-directory: apps/backend
        env:
          MAINBRELLA_SDK_CANDIDATE: artifacts/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-local-qualification
          path: apps/backend/artifacts/sdk/
          retention-days: 7

  web:
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.builder == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @canopy/web
      - if: needs.changes.outputs.site == 'true'
        run: npm run build:site -w @canopy/web
      - if: needs.changes.outputs.builder == 'true'
        run: npm run build:builder -w @canopy/web

  raindrop:
    needs: changes
    if: needs.changes.outputs.raindrop_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @canopy/raindrop
      - run: npm run check:routes -w @canopy/raindrop

  operations:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test scripts/tests/*.cjs
        working-directory: apps/raindrop
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
        working-directory: apps/raindrop

  staging:
    needs: changes
    if: needs.changes.outputs.backend_full == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.builder == 'true' || needs.changes.outputs.raindrop_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # This path uses offline resource IDs and never discovers, creates,
      # migrates, or publishes Cloudflare resources. No token is provided.
      - run: npm run stg:check

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:generate -w @canopy/backend
      - run: npm run docs:check -w @canopy/web
      - run: git diff --exit-code -- apps/web/API.md apps/web/SKILL.md apps/web/public/references apps/web/public/skills

  # Keep the existing required status name and reject an unexpectedly skipped job.
  test:
    needs: [changes, backend-full, backend-services, sdk-artifacts, web, raindrop, operations, staging, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require every selected check to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.CHECK_RESULTS);
          if (jobs.changes.result !== 'success') process.exit(1);
          if (Object.values(jobs).some(job => !['success', 'skipped'].includes(job.result))) process.exit(1);
          const scope = jobs.changes.outputs;
          const expected = [
            ['backend-full', scope.backend_full === 'true'],
            ['backend-services', scope.backend_full !== 'true' && JSON.parse(scope.services).length > 0],
            ['sdk-artifacts', scope.sdk === 'true'],
            ['web', scope.site === 'true' || scope.builder === 'true'],
            ['raindrop', scope.raindrop_ui === 'true'],
            ['operations', scope.ops === 'true'],
            ['staging', scope.backend_full === 'true' || scope.site === 'true' || scope.builder === 'true' || scope.raindrop_ui === 'true'],
            ['docs', scope.docs === 'true'],
          ];
          for (const [name, selected] of expected) {
            if (selected && jobs[name].result !== 'success') {
              console.error(`${name}: expected success, got ${jobs[name].result}`);
              process.exitCode = 1;
            }
          }
          JS
