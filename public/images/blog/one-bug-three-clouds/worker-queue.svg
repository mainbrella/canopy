<svg xmlns="http://www.w3.org/2000/svg" width="850" height="650" viewBox="0 0 850 650" role="img" aria-labelledby="title desc">
<title id="title">Five jobs in memory</title><desc id="desc">Observed seed-12346 controls. E2B copies five queued jobs into each of three workers; baseline returns C, E and A, correct patch returns B, C, D, E and A, and misleading patch returns none. B and D have zero unit price. Mainbrella and Daytona filesystem restores start empty workers and return no receipts. A cold restart loses all jobs on every provider.</desc>
