<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">Saved files, fresh servers</title>
  <desc id="desc">Schematic of the local and production Mainbrella experiments, not a measured timeline. The source server runs through capture. The saved filesystem branches into three restores, initially without a listening server. Each server is started explicitly and has a fresh in-memory nonce.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#55616c" stroke-width="1.4"/></marker>
    <g id="files" fill="#f7f4ec" stroke="#55616c" stroke-width="2"><path d="M0 3h15l5 7h26v30H0z"/><path d="M8 17h30M8 25h30M8 33h20"/></g>
  </defs>
  <style>text{font-family:Helvetica,Arial,sans-serif;fill:#263238;font-size:19px}.small{font-size:17px;fill:#55616c}.heading{font-size:25px;font-weight:600}.label{font-weight:600}.file-path{fill:none;stroke:#55616c;stroke-width:2;marker-end:url(#arrow)}.process{fill:none;stroke:#397b5c;stroke-width:4}.absent{fill:none;stroke:#55616c;stroke-width:2;stroke-dasharray:5 6}</style>
