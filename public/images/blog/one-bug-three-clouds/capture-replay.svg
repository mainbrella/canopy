<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Three requests, one workspace</title>
  <desc id="desc">Schematic of the observed production Mainbrella response-loss test, not an elapsed-time chart. Capture with body B and key K creates workspace W. The client receives successful headers and discards the response body. A retry and a replay use the same body and key; both read the existing workspace and return W. There is only one creation.</desc>
  <defs>
    <marker id="request" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#55616c" stroke-width="1.4"/></marker>
    <marker id="response" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#397b5c" stroke-width="1.4"/></marker>
  </defs>
  <style>text{font-family:Helvetica,Arial,sans-serif;fill:#263238;font-size:18px}.heading{font-size:25px;font-weight:600}.small{font-size:16px;fill:#55616c}.actor{font-weight:600}.lane{fill:none;stroke:#a7adb0;stroke-width:1.5;stroke-dasharray:5 6}.request{fill:none;stroke:#55616c;stroke-width:2;marker-end:url(#request)}.response{fill:none;stroke:#397b5c;stroke-width:2;marker-end:url(#response)}.lost{fill:none;stroke:#9c4538;stroke-width:2;stroke-dasharray:5 5}.failure{fill:#9c4538}.saved{fill:#397b5c}</style>
  <rect width="800" height="440" rx="4" fill="#f7f4ec"/>
  <text x="28" y="39" class="heading">Three requests, one workspace</text>
  <text x="28" y="65" class="small">Observed production test · schematic, not elapsed time</text>
  <text x="74" y="107" text-anchor="middle" class="actor">Client</text>
  <text x="427" y="107" text-anchor="middle" class="actor">Mainbrella API</text>
  <text x="703" y="107" text-anchor="middle" class="actor">Saved workspace W</text>
  <path d="M74 121V402M427 121V402" class="lane"/>
  <path d="M703 174V401" fill="none" stroke="#397b5c" stroke-width="3"/>
  <text x="158" y="138">Capture · body B + key K</text>
  <path d="M83 149H417" class="request"/>
  <text x="535" y="164" class="small">Create W</text>
  <path d="M438 174H691" class="request"/>
  <circle cx="703" cy="174" r="6" fill="#397b5c"/>
  <text x="186" y="190" class="small">HTTP 200 headers</text>
  <path d="M417 201H84" class="request"/>
  <text x="155" y="228" class="failure">Client discards the body</text>
  <path d="M417 238H134" class="lost"/>
  <path d="M124 231l14 14m0-14-14 14" stroke="#9c4538" stroke-width="2.5"/>
  <text x="174" y="270">Retry · body B + key K</text>
  <path d="M83 281H417" class="request"/>
  <text x="535" y="270" class="small">Read W</text>
  <path d="M438 281H691" class="request"/>
  <circle cx="703" cy="281" r="4" fill="#397b5c"/>
  <text x="180" y="307" class="saved">HTTP 200 · workspace W</text>
  <path d="M417 318H84" class="response"/>
  <text x="166" y="348">Replay · body B + key K</text>
  <path d="M83 359H417" class="request"/>
  <text x="535" y="348" class="small">Read W</text>
  <path d="M438 359H691" class="request"/>
  <circle cx="703" cy="359" r="4" fill="#397b5c"/>
  <text x="180" y="385" class="saved">HTTP 200 · workspace W</text>
  <path d="M417 396H84" class="response"/>
  <text x="703" y="424" text-anchor="middle" class="small">One creation</text>
</svg>
