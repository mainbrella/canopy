="268" y="333" width="20" height="30" rx="2" class="missing"/><path d="M292 333h14l6 6v24h-20zM306 333v6h6" class="receipt"/><text x="302" y="354" class="letter" text-anchor="middle">E</text><path d="M316 333h14l6 6v24h-20zM330 333v6h6" class="receipt"/><text x="326" y="354" class="letter" text-anchor="middle">A</text><text x="49" y="410" class="label" text-anchor="start">Fake patch</text><text x="220" y="410" class="count short" text-anchor="start">0 / 5 receipts</text><path d="M24 444h19" class="flow"/><rect x="49" y="422" width="136" height="44" rx="4" class="queue"/><rect x="57" y="429" width="20" height="30" rx="2" class="job"/><text x="67" y="450" class="letter" text-anchor="middle">B</text><rect x="81" y="429" width="20" height="30" rx="2" class="job"/><text x="91" y="450" class="letter" text-anchor="middle">C</text><rect x="105" y="429" width="20" height="30" rx="2" class="job"/><text x="115" y="450" class="letter" text-anchor="middle">D</text><rect x="129" y="429" width="20" height="30" rx="2" class="job"/><text x="139" y="450" class="letter" text-anchor="middle">E</text><rect x="153" y="429" width="20" height="30" rx="2" class="job"/><text x="163" y="450" class="letter" text-anchor="middle">A</text><path d="M189 444h23" class="flow"/><rect x="220" y="429" width="20" height="30" rx="2" class="missing"/><rect x="244" y="429" width="20" height="30" rx="2" class="missing"/><rect x="268" y="429" width="20" height="30" rx="2" class="missing"/><rect x="292" y="429" width="20" height="30" rx="2" class="missing"/><rect x="316" y="429" width="20" height="30" rx="2" class="missing"/><text x="20" y="523" class="heading" text-anchor="start">Copying files</text><text x="20" y="549" class="small" text-anchor="start">Mainbrella / Daytona · filesystem copies</text><g class="files"><path d="M54 579h35v43h-35z"/><path d="M48 583h35v43h-35z"/><path d="M42 587h27l8 8v35h-35zM69 587v8h8"/><path d="M49 603h20M49 610h14M49 617h18" class="file-lines"/></g><path d="M111 611h101" cl