<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" role="img" aria-labelledby="title desc">
  <title id="title">Retry the save, keep the connection</title>
  <desc id="desc">A successful Parsequerade connection is held pending in Studio when a local save fails. A retry saves the same connection before Studio makes it available to readers.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#34464d" stroke-width="1.5"/></marker>
    <marker id="error-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#a03c35" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="540" fill="#f7f4ec"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263238">
    <text x="36" y="39" font-size="21" font-weight="700">Retry the save, keep the connection</text>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="140" y="85">Parsequerade</text>
      <text x="420" y="85">Studio</text>
      <text x="700" y="85">Settings file</text>
    </g>
    <g stroke="#b8c0bf" stroke-width="1.5" stroke-dasharray="5 6">
      <path d="M140 103V475"/><path d="M420 103V475"/><path d="M700 103V475"/>
    </g>
    <path d="M37 117V471" fill="none" stroke="#68777c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="25" y="302" font-size="13" fill="#52646a" text-anchor="middle" transform="rotate(-90 25 302)">time</text>
    <g stroke="#34464d" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
      <path d="M418 130H142"/>
      <path d="M142 187H418"/>
      <path d="M422 239H698"/>
      <path d="M422 365H698"/>
      <path d="M698 421H422" stroke-dasharray="5 4"/>
    </g>
    <path d="M698 285H422" fill="none" stroke="#a03c35" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#error-arrow)"/>
    <g font-size="16" text-anchor="middle">
      <text x="280" y="119">Create connection</text>
      <text x="280" y="176">Connection + bearer key</text>
      <text x="560" y="228">Save connection</text>
      <text x="560" y="274" fill="#a03c35">Disk write failed</text>
      <text x="560" y="354">Retry save, same key</text>
      <text x="560" y="410" fill="#276246">Saved</text>
    </g>
    <rect x="410" y="300" width="20" height="39" rx="3" fill="#e5c77c" stroke="#8e6b23"/>
    <text x="399" y="325" font-size="16" text-anchor="end">Keep pending key in memory</text>
    <circle cx="420" cy="467" r="6" fill="#276246"/>
    <text x="439" y="473" font-size="16" fill="#276246">Make connection available to readers</text>
    <text x="36" y="516" font-size="15" fill="#52646a">A save retry makes no second connection request.</text>
  </g>
</svg>
