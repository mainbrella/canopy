<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440">
  <title>Two kinds of localized metadata</title>
  <desc>An app branches into selected app information and a selected version. Each branch has its own locale resources, with different fields.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#58626c" stroke-width="1.3"/></marker></defs>
  <rect width="840" height="440" rx="4" fill="#f5f2ea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#263238">
    <rect x="325" y="28" width="190" height="58" rx="29" fill="#e4e8eb"/>
    <text x="420" y="64" font-size="23" font-weight="600" text-anchor="middle">App</text>
    <g fill="none" stroke="#58626c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M420 86v20H226v31"/>
      <path d="M420 106h194v31"/>
      <path d="M226 192v44"/>
      <path d="M614 192v44"/>
    </g>
    <rect x="104" y="142" width="244" height="50" rx="4" fill="#e3eaf2"/>
    <rect x="492" y="142" width="244" height="50" rx="4" fill="#dfece3"/>
    <text x="226" y="173" font-size="22" font-weight="600" text-anchor="middle">App information</text>
    <text x="614" y="173" font-size="22" font-weight="600" text-anchor="middle">Selected version</text>
    <rect x="80" y="233" width="276" height="151" rx="4" fill="#fffdf8" stroke="#a4b6c9"/>
    <text x="99" y="260" font-size="18" fill="#526579">en-US</text>
    <rect x="98" y="273" width="276" height="143" rx="4" fill="#e3eaf2" stroke="#7c94ad"/>
    <text x="119" y="302" font-size="19" font-weight="600">fr-FR</text>
    <path d="M118 314h236" stroke="#b2c1d0"/>
    <g font-size="20"><text x="119" y="340">Name</text><text x="119" y="367">Subtitle</text><text x="119" y="394">Privacy URL</text></g>
    <rect x="468" y="233" width="276" height="151" rx="4" fill="#fffdf8" stroke="#98b4a2"/>
    <text x="487" y="260" font-size="18" fill="#496954">en-US</text>
    <rect x="486" y="273" width="276" height="143" rx="4" fill="#dfece3" stroke="#769b83"/>
    <text x="507" y="302" font-size="19" font-weight="600">fr-FR</text>
    <path d="M506 314h236" stroke="#abc5b5"/>
    <g font-size="20"><text x="507" y="340">Description</text><text x="507" y="367">Keywords</text><text x="507" y="394">Release notes</text></g>
  </g>
</svg>
