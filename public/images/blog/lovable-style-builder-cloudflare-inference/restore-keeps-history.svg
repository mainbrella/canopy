<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
  <title>A restore adds a commit</title>
  <desc>Parent links keep commits A and B. The restore copies A's source into new commit C.</desc>
  <defs>
    <marker id="parent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#35444e" stroke-width="1.8"/></marker>
    <marker id="copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#236078" stroke-width="1.8"/></marker>
    <g id="simple"><path d="M-22 0H9L23 14V54H-22Z" fill="#e0eef2" stroke="#236078" stroke-width="2"/><path d="M9 0V14H23M-11 26H12M-11 36H12M-11 46H2" fill="none" stroke="#236078" stroke-width="2"/></g>
  </defs>
  <rect width="880" height="330" rx="4" fill="#f7f4ec"/>
  <g font-family="system-ui, sans-serif" fill="#263238" text-anchor="middle">
    <text x="440" y="41" font-size="23" font-weight="600">Restore the files. Keep the intervening work.</text>
    <path d="M197 101H410" stroke="#35444e" stroke-width="2.5" fill="none" marker-end="url(#parent)"/>
    <path d="M467 101H681" stroke="#35444e" stroke-width="2.5" fill="none" marker-end="url(#parent)"/>
    <circle cx="170" cy="101" r="24" fill="#236078"/><circle cx="440" cy="101" r="24" fill="#91512f"/><circle cx="710" cy="101" r="24" fill="#236078"/>
    <g fill="#fff" font-size="23" font-weight="600"><text x="170" y="109">A</text><text x="440" y="109">B</text><text x="710" y="109">C</text></g>
    <text x="170" y="151" font-size="21">Simple tracker</text><text x="440" y="151" font-size="21">Add reports</text><text x="710" y="151" font-size="21">Restore A</text>
    <use href="#simple" x="170" y="171"/><use href="#simple" x="710" y="171"/>
    <g transform="translate(440 171)"><path d="M-22 0H9L23 14V54H-22Z" fill="#f3e4d8" stroke="#91512f" stroke-width="2"/><path d="M9 0V14H23M-11 26H12M-11 36H12M-11 46H12" fill="none" stroke="#91512f" stroke-width="2"/><path d="M28 31H48M28 40H48M28 49H48" stroke="#91512f" stroke-width="2"/></g>
    <path d="M170 234V254Q170 264 180 264H700Q710 264 710 254V232" stroke="#236078" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#copy)"/>
    <text x="440" y="300" font-size="20" fill="#236078">Copy A’s source into a new commit</text>
  </g>
</svg>
