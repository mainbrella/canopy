<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370">
  <title>Change the backend, keep the project address</title>
  <defs>
    <marker id="old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#646866" stroke-width="1.8"/></marker>
    <marker id="current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#236078" stroke-width="1.8"/></marker>
    <g id="machine"><rect width="66" height="79" rx="3" fill="#fffdf7" stroke="currentColor" stroke-width="2"/><path d="M12 17H54M12 33H54M12 49H54" stroke="currentColor" stroke-width="2"/><circle cx="49" cy="65" r="3" fill="currentColor"/></g>
  </defs>
  <rect width="880" height="370" rx="4" fill="#f7f4ec"/>
  <g font-family="system-ui, sans-serif" fill="#263238">
    <text x="32" y="42" font-size="23" font-weight="600">One address. A new backend.</text>
    <rect x="36" y="141" width="345" height="91" rx="4" fill="#fffdf7" stroke="#236078" stroke-width="2"/>
    <path d="M36 165H381" stroke="#236078" stroke-width="1.5"/>
    <g fill="#236078"><circle cx="50" cy="153" r="3"/><circle cx="62" cy="153" r="3"/><circle cx="74" cy="153" r="3"/></g>
    <text x="208" y="207" text-anchor="middle" font-size="24" fill="#236078">p-…mainbrella.dev</text>
    <text x="208" y="265" text-anchor="middle" font-size="20">Visitor’s bookmark stays here</text>
    <path d="M381 186H431Q446 186 446 171V110Q446 95 461 95H655" fill="none" stroke="#646866" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#old)"/>
    <path d="M381 186H431Q446 186 446 201V278Q446 293 461 293H655" fill="none" stroke="#236078" stroke-width="3" marker-end="url(#current)"/>
    <text x="468" y="78" font-size="21" fill="#646866">Previous binding</text>
    <text x="468" y="274" font-size="21" fill="#236078">Current binding</text>
    <use href="#machine" x="680" y="61" color="#646866"/>
    <use href="#machine" x="680" y="250" color="#236078"/>
    <text x="764" y="91" font-size="20">Machine A</text><text x="764" y="119" font-size="20" fill="#646866">:3000</text>
    <text x="764" y="280" font-size="20">Machine B</text><text x="764" y="308" font-size="20" fill="#236078">:8080</text>
  </g>
</svg>
