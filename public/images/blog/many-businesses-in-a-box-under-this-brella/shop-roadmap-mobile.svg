<svg xmlns="http://www.w3.org/2000/svg" width="440" height="900" viewBox="0 0 440 900" role="img" aria-labelledby="title desc">
    <title id="title">A bike shop's planned MainBrella composition, mobile layout</title>
    <desc id="desc">A shop website flows through planned web scraping into a planned knowledge base. Planned background jobs refresh the scrape on a schedule. The same knowledge base is planned to connect to existing voice, app, and Linux agent services. These connections are planned, not implemented.</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a45f47"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .planned-box{fill:#f4e9df;stroke:#a45f47;stroke-width:1.8;stroke-dasharray:6 5}
  .existing-box{fill:#e8eee7;stroke:#698476;stroke-width:1.8}
  .planned-line{fill:none;stroke:#a45f47;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}
  .existing-line{fill:none;stroke:#698476;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></defs><rect width="440" height="900" fill="#f7f4ec"/>
    <text x="24" y="39" text-anchor="start" font-size="12" font-weight="700" fill="#a45f47">PLANNED COMPOSITION</text>
    <text x="24" y="70" text-anchor="start" font-size="22" font-weight="650" fill="#263238">One bike shop, shared context</text>

    <!-- Website to scraper to knowledge base -->
    <g transform="translate(195 92) scale(0.8)" fill="none" stroke="#263238" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2h27l12 12v42H2z"/><path d="M29 2v13h12M10 27h22M10 36h22M10 45h16"/>
  </g>
    <text x="220" y="157" text-anchor="middle" font-size="16" font-weight="600" fill="#263238">Shop website</text>
    <text x="220" y="177" text-anchor="middle" font-size="15" font-weight="450" fill="#64716d">Service info</text>
    <path d="M220 185 L220 207" class="planned-line" marker-end="url(#arrow)"/>

    <rect class="planned-box" x="154" y="207" width="132" height="96" rx="8"/>
    <g transform="translate(194 217) scale(0.9)" fill="none" stroke="#a45f47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="50" height="39" rx="4"/><path d="M1 12h50M8 7h.1M14 7h.1M20 7h.1M12 21h27M12 28h20M12 35h13"/>
  </g>
    <text x="220" y="273" text-anchor="middle" font-size="16" font-weight="650" fill="#263238">Web scraping</text>
    <text x="220" y="293" text-anchor="middle" font-size="15" font-weight="500" fill="#64716d">Extract site info</text>

    <rect class="planned-box" x="22" y="207" width="120" height="124" rx="8"/>
    <g transform="translate(61 215)" fill="none" stroke="#a45f47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="21" r="17"/><path d="M21 11v11l8 5M13 1h16"/>
  </g>
    <text x="82" y="278" text-anchor="middle" font-size="16" font-weight="650" fill="#263238">Background</text>
    <text x="82" y="298" text-anchor="middle" font-size="16" font-weight="650" fill="#263238">jobs</text>
    <text x="82" y="319" text-anchor="middle" font-size="15" font-weight="500" fill="#64716d">Refresh scrape</text>
    <path d="M142 263H154" class="planned-line" marker-end="url(#arrow)"/>

    <path d="M220 303 L220 340" class="planned-line" marker-end="url(#arrow)"/>
    <rect class="planned-box" x="140" y="340" width="160" height="95" rx="8"/>
    <g transform="translate(197 350) scale(0.9)" fill="none" stroke="#a45f47" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8 24 2l22 6-22 7zM2 8v27l22 7 22-7V8M24 15v27"/>
    <circle cx="13" cy="24" r="1.4" fill="#a45f47"/><circle cx="34" cy="26" r="1.4" fill="#a45f47"/><circle cx="18" cy="34" r="1.4" fill="#a45f47"/>
  </g>
    <text x="220" y="407" text-anchor="middle" font-size="17" font-weight="650" fill="#263238">Knowledge base</text>
    <text x="220" y="427" text-anchor="middle" font-size="15" font-weight="500" fill="#64716d">Shared shop data</text>

    <!-- Planned fan-out bus stays outside the service rows -->
    <path d="M300 388H420V736" class="planned-line"/>

    <!-- Existing services, laid out as compact rows -->
    <rect class="existing-box" x="31" y="474" width="378" height="88" rx="8"/>
    <g transform="translate(53 494)" fill="none" stroke="#698476" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 4c-3 1-5 4-4 8 3 11 12 20 23 23 4 1 7-1 8-4l1-5-10-5-4 5c-4-2-7-5-9-9l5-4-5-10z"/>
  </g>
    <text x="120" y="510" text-anchor="start" font-size="18" font-weight="650" fill="#263238">Voice receptionist</text>
    <text x="120" y="538" text-anchor="start" font-size="15" font-weight="500" fill="#64716d">Answer callers</text>

    <rect class="existing-box" x="31" y="582" width="378" height="88" rx="8"/>
    <g transform="translate(53 601)" fill="none" stroke="#698476" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="48" height="34" rx="3"/><path d="M1 10h48M18 44h14M25 36v8M9 6h.1M15 6h.1M10 17h12M10 23h28M10 29h20"/>
  </g>
    <text x="120" y="618" text-anchor="start" font-size="18" font-weight="650" fill="#263238">Shop app</text>
    <text x="120" y="646" text-anchor="start" font-size="15" font-weight="500" fill="#64716d">Built with Builder</text>

    <rect class="existing-box" x="31" y="690" width="378" height="88" rx="8"/>
    <g transform="translate(53 709)" fill="none" stroke="#698476" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="49" height="37" rx="3"/><path d="M1 10h49M9 19l6 5-6 5M20 30h12"/>
  </g>
    <text x="120" y="726" text-anchor="start" font-size="18" font-weight="650" fill="#263238">Linux agent</text>
    <text x="120" y="754" text-anchor="start" font-size="15" font-weight="500" fill="#64716d">Custom processing</text>

    <!-- Put incoming arrowheads above the row fills so their direction stays visible -->
    <path d="M420 518 L385 518" class="planned-line" marker-end="url(#arrow)"/><path d="M420 626 L385 626" class="planned-line" marker-end="url(#arrow)"/><path d="M420 734 L385 734" class="planned-line" marker-end="url(#arrow)"/>

    <!-- Status key -->
    <path d="M24 800H416" stroke="#d8d2c7" stroke-width="1"/>
    <rect x="28" y="817" width="21" height="16" rx="3" class="existing-box"/>
    <text x="58" y="831" text-anchor="start" font-size="15" font-weight="550" fill="#263238">Existing service</text>
    <rect x="220" y="817" width="21" height="16" rx="3" class="planned-box"/>
    <text x="250" y="831" text-anchor="start" font-size="15" font-weight="550" fill="#263238">Planned service / link</text>
    <text x="28" y="875" text-anchor="start" font-size="15" font-weight="550" fill="#64716d">One owner · one prepaid wallet</text>
  </svg>