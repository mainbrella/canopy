<svg xmlns="http://www.w3.org/2000/svg" width="440" height="540" viewBox="0 0 440 540">
  <title>Git history survives between build sessions</title>
  <desc>Time moves down. Machine A saves commit A and stops. Git history continues down the left while no guest is running. Machine B loads A and saves commit B, with its own preview.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#286579" stroke-width="1.8"/></marker>
  </defs>
  <rect width="440" height="540" rx="4" fill="#f7f4ec"/>
  <g font-family="system-ui, sans-serif" fill="#263238">
    <text x="24" y="36" font-size="24" font-weight="600">The work survives the gap</text>
    <text x="68" y="78" text-anchor="middle" font-size="21" fill="#286579">Git</text>
    <text x="311" y="78" text-anchor="middle" font-size="21">Compute</text>
    <path d="M68 99V505" stroke="#286579" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <circle cx="68" cy="151" r="20" fill="#286579"/>
    <circle cx="68" cy="449" r="20" fill="#286579"/>
    <g fill="#fffdf7" text-anchor="middle" font-size="24" font-weight="600"><text x="68" y="160">A</text><text x="68" y="458">B</text></g>
    <g fill="#f2e4d8" stroke="#935334" stroke-width="2">
      <rect x="226" y="100" width="190" height="139" rx="4"/>
      <rect x="226" y="352" width="190" height="139" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="321" y="132" font-size="23" font-weight="600">Machine A</text>
      <text x="321" y="163" font-size="20">First build</text>
      <text x="321" y="384" font-size="23" font-weight="600">Machine B</text>
      <text x="321" y="415" font-size="20">Add date filter</text>
      <rect x="240" y="193" width="162" height="31" rx="2" fill="#935334"/>
      <rect x="240" y="445" width="162" height="31" rx="2" fill="#935334"/>
      <text x="321" y="215" font-size="20" fill="#fffdf7">Preview</text>
      <text x="321" y="467" font-size="20" fill="#fffdf7">New preview</text>
      <text x="321" y="289" font-size="22" fill="#58605e">Stopped</text>
      <text x="321" y="316" font-size="20" fill="#58605e">No guest running</text>
    </g>
    <g stroke="#286579" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M224 151H94"/>
      <path d="M70 382H219"/>
      <path d="M224 449H94"/>
    </g>
    <g text-anchor="middle" font-size="20" fill="#286579">
      <text x="158" y="136">Save code</text>
      <text x="148" y="368">Load A</text>
      <text x="158" y="435">Save code</text>
    </g>
    <g fill="#58605e" font-size="18"><text x="99" y="282">History</text><text x="99" y="308">remains</text><text x="99" y="510">Time ↓</text></g>
  </g>
</svg>
