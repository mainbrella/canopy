<svg xmlns="http://www.w3.org/2000/svg" width="350" height="612" viewBox="0 0 350 612" role="img" aria-labelledby="title desc">
<title id="title">Git history across R2 bundles and D1 versions</title>
<desc id="desc">Native Git creates A, B, then C. R2 stores an initial bundle for A and increments B and C that omit the previous commit. Manifest B points back to A; manifest C points back to B. D1 versions reference their matching manifests through bundle_key, and version C is the current head. The Worker uploads immutable R2 parts and manifests before publishing the D1 version and head.</desc>
<defs>
  <marker id="mArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616a"/></marker>
  <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker>
  <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker>
</defs>
<rect width="350" height="612" fill="#f7f4ec"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#263238">
  <text x="16" y="24" font-size="18" font-weight="600">Git history in R2 and D1</text>
  <text x="16" y="44" font-size="13" fill="#53616a">Native Git · commit creation order</text>
  <path d="M96 70H158M192 70H254" fill="none" stroke="#52616a" stroke-width="1.8" marker-end="url(#mArrow)"/>
  <circle cx="79" cy="70" r="15" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/>
  <circle cx="175" cy="70" r="15" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/>
  <circle cx="271" cy="70" r="15" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/>
  <text x="79" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#275f85">A</text>
  <text x="175" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#275f85">B</text>
  <text x="271" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#275f85">C</text>

  <text x="16" y="108" font-size="15" font-weight="600" fill="#275f85">R2 · manifests and immutable parts</text>
  <text x="16" y="127" font-size="13" fill="#53616a">1 MiB parts · each part key is its SHA-256</text>
  <path d="M20 155V362" stroke="#9ba7ac" stroke-width="1.5"/>
  <circle cx="20" cy="176" r="4" fill="#275f85"/>
  <circle cx="20" cy="263" r="4" fill="#275f85"/>
  <circle cx="20" cy="350" r="4" fill="#275f85"/>
  <path d="M27 262H11V176H27" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#mArrow)"/>
  <path d="M27 349H7V263H27" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#mArrow)"/>
  <g>
    <rect x="27" y="139" width="307" height="74" rx="5" fill="#fffdf7" stroke="#c9c8bd" stroke-width="1.3"/>
    <text x="39" y="158" font-size="14" font-weight="600">manifest A</text>
    <text x="39" y="176" font-size="13" fill="#275f85">initial bundle · A</text>
    <text x="39" y="194" font-size="13" fill="#53616a">previousBundleKey: null</text>
    <text x="39" y="209" font-size="13" fill="#53616a">prerequisiteCommitId: null</text>
  </g>
  <g>
    <rect x="27" y="226" width="307" height="74" rx="5" fill="#fffdf7" stroke="#c9c8bd" stroke-width="1.3"/>
    <text x="39" y="245" font-size="14" font-weight="600">manifest B</text>
    <text x="39" y="263" font-size="13" fill="#275f85">increment · B omits A</text>
    <text x="39" y="281" font-size="13" fill="#53616a">previousBundleKey: A</text>
    <text x="39" y="296" font-size="13" fill="#53616a">prerequisiteCommitId: A</text>
  </g>
  <g>
    <rect x="27" y="313" width="307" height="74" rx="5" fill="#fffdf7" stroke="#c9c8bd" stroke-width="1.3"/>
    <text x="39" y="332" font-size="14" font-weight="600">manifest C</text>
    <text x="39" y="350" font-size="13" fill="#275f85">increment · C omits B</text>
    <text x="39" y="368" font-size="13" fill="#53616a">previousBundleKey: B</text>
    <text x="39" y="383" font-size="13" fill="#53616a">prerequisiteCommitId: B</text>
  </g>

  <text x="16" y="410" font-size="15" font-weight="600" fill="#2a6948">D1 · version records</text>
  <text x="16" y="428" font-size="13" fill="#53616a">bundle_key points ↑ to each matching manifest</text>
  <rect x="16" y="438" width="318" height="30" rx="4" fill="#e4efe7" stroke="#9bb6a0"/>
  <text x="28" y="458" font-size="13" fill="#2a6948">version A</text>
  <text x="202" y="458" font-size="13" fill="#2a6948">bundle_key ↑ A</text>
  <rect x="16" y="472" width="318" height="30" rx="4" fill="#e4efe7" stroke="#9bb6a0"/>
  <text x="28" y="492" font-size="13" fill="#2a6948">version B</text>
  <text x="202" y="492" font-size="13" fill="#2a6948">bundle_key ↑ B</text>
  <rect x="16" y="506" width="318" height="34" rx="4" fill="#d8e8dc" stroke="#2a6948" stroke-width="1.5"/>
  <text x="28" y="528" font-size="13" font-weight="600" fill="#2a6948">version C · current head</text>
  <text x="202" y="528" font-size="13" font-weight="600" fill="#2a6948">bundle_key ↑ C</text>

  <path d="M16 548H334" stroke="#c9c8bd" stroke-width="1.3"/>
  <text x="16" y="570" font-size="13" font-weight="600" fill="#275f85">Worker uploads</text>
  <text x="16" y="589" font-size="13" font-weight="600" fill="#275f85">R2 parts + manifests</text>
  <path d="M148 578H178" fill="none" stroke="#275f85" stroke-width="1.7" marker-end="url(#mBlue)"/>
  <path d="M190 554V601" stroke="#9b3933" stroke-width="2"/>
  <text x="202" y="570" font-size="13" font-weight="600" fill="#2a6948">then D1 publishes</text>
  <text x="202" y="589" font-size="13" font-weight="600" fill="#2a6948">version + head</text>
</g>
</svg>
