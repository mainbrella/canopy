<svg xmlns="http://www.w3.org/2000/svg" width="784" height="460" viewBox="0 0 784 460" role="img" aria-labelledby="title desc">
<title id="title">Git creation order, R2 bundle links, and D1 version references</title>
<desc id="desc">Native Git creates commits A, B, then C in order. R2 stores an initial bundle for A, an increment for B that omits A, and an increment for C that omits B. The B manifest points backward to A and the C manifest points backward to B through previousBundleKey; prerequisiteCommitId records the prerequisite commit. Each D1 version's bundle_key points upward to its matching R2 manifest. Version C is the current head. The Worker uploads immutable R2 parts and manifests before D1 publishes the version and head.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616a"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker>
</defs>
<rect width="784" height="460" fill="#f7f4ec"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#263238">
  <text x="22" y="27" font-size="19" font-weight="600">Git history across R2 bundles and D1 versions</text>
  <text x="22" y="50" font-size="14" fill="#53616a">Native Git · commit creation order</text>
  <path d="M164 79H367M417 79H620" fill="none" stroke="#52616a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="138" cy="79" r="19" fill="#e4eff4" stroke="#275f85" stroke-width="2"/>
  <circle cx="392" cy="79" r="19" fill="#e4eff4" stroke="#275f85" stroke-width="2"/>
  <circle cx="646" cy="79" r="19" fill="#e4eff4" stroke="#275f85" stroke-width="2"/>
  <text x="138" y="85" text-anchor="middle" font-size="16" font-weight="600" fill="#275f85">A</text>
  <text x="392" y="85" text-anchor="middle" font-size="16" font-weight="600" fill="#275f85">B</text>
  <text x="646" y="85" text-anchor="middle" font-size="16" font-weight="600" fill="#275f85">C</text>

  <text x="22" y="124" font-size="16" font-weight="600" fill="#275f85">R2 · immutable manifests and parts</text>
  <text x="22" y="145" font-size="14" fill="#53616a">1 MiB parts · each part key is its SHA-256</text>

  <path d="M279 210H256" fill="none" stroke="#52616a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M533 210H510" fill="none" stroke="#52616a" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="25" y="157" width="226" height="119" rx="5" fill="#fffdf7" stroke="#c9c8bd" stroke-width="1.5"/>
    <text x="39" y="180" font-size="16" font-weight="600">manifest A</text>
    <text x="39" y="203" font-size="14" fill="#275f85">initial bundle · A</text>
    <text x="39" y="229" font-size="14" fill="#53616a">previousBundleKey: —</text>
    <text x="39" y="252" font-size="14" fill="#53616a">prerequisiteCommitId: —</text>
  </g>
  <g>
    <rect x="279" y="157" width="226" height="119" rx="5" fill="#fffdf7" stroke="#c9c8bd" stroke-width="1.5"/>
    <text x="293" y="180" font-size="16" font-weight="600">manifest B</text>
    <text x="293" y="203" font-size="14" fill="#275f85">increment · B omits A</text>
    <text x="293" y="229" font-size="14" fill="#53616a">previousBundleKey: A</text>
    <text x="293" y="252" font-size="14" fill="#53616a">prerequisiteCommitId: A</text>
  </g>
  <g>
    <rect x="533" y="157" width="226" height="119" rx="5" fill="#fffdf7" stroke="#c9c8bd" stroke-width="1.5"/>
    <text x="547" y="180" font-size="16" font-weight="600">manifest C</text>
    <text x="547" y="203" font-size="14" fill="#275f85">increment · C omits B</text>
    <text x="547" y="229" font-size="14" fill="#53616a">previousBundleKey: B</text>
    <text x="547" y="252" font-size="14" fill="#53616a">prerequisiteCommitId: B</text>
  </g>

  <text x="22" y="310" font-size="16" font-weight="600" fill="#2a6948">D1 versions</text>
  <path d="M138 337V278" fill="none" stroke="#2a6948" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <path d="M392 337V278" fill="none" stroke="#2a6948" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <path d="M646 337V278" fill="none" stroke="#2a6948" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <g>
    <rect x="25" y="337" width="226" height="59" rx="5" fill="#e4efe7" stroke="#9bb6a0" stroke-width="1.5"/>
    <text x="39" y="360" font-size="14" font-weight="600" fill="#2a6948">version A</text>
    <text x="39" y="382" font-size="14" fill="#2a6948">bundle_key ↑ manifest A</text>
  </g>
  <g>
    <rect x="279" y="337" width="226" height="59" rx="5" fill="#e4efe7" stroke="#9bb6a0" stroke-width="1.5"/>
    <text x="293" y="360" font-size="14" font-weight="600" fill="#2a6948">version B</text>
    <text x="293" y="382" font-size="14" fill="#2a6948">bundle_key ↑ manifest B</text>
  </g>
  <g>
    <rect x="533" y="337" width="226" height="59" rx="5" fill="#d8e8dc" stroke="#2a6948" stroke-width="2"/>
    <text x="547" y="360" font-size="14" font-weight="600" fill="#2a6948">version C · current head</text>
    <text x="547" y="382" font-size="14" fill="#2a6948">bundle_key ↑ manifest C</text>
  </g>

  <path d="M22 411H762" stroke="#c9c8bd" stroke-width="1.5"/>
  <text x="22" y="440" font-size="14" font-weight="600" fill="#275f85">Worker uploads immutable R2 parts + manifests</text>
  <path d="M365 435H405" fill="none" stroke="#275f85" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M428 417V450" stroke="#9b3933" stroke-width="2.5"/>
  <text x="447" y="440" font-size="14" font-weight="600" fill="#2a6948">then D1 publishes version + head</text>
</g>
</svg>
